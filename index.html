<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Racer — 2 Lanes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
  }

  #wrapper {
    display: flex;
    flex-direction: row;
    border: 4px solid #e8d200;
    background: #2a2a2a;
  }

  #gameCanvas {
    display: block;
    background: #5a6a50;
  }

  #panel {
    width: 110px;
    background: #8a9a80;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 8px 8px 8px;
    gap: 18px;
    border-left: 3px solid #3a4a30;
  }

  .panel-block {
    text-align: center;
    color: #1a1a1a;
    font-family: monospace;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.6;
  }

  .panel-label {
    font-size: 13px;
    font-weight: normal;
    color: #2a2a2a;
  }

  #controls {
    display: flex;
    flex-direction: row;
    gap: 20px;
    margin-top: 14px;
  }

  .ctrl-btn {
    width: 64px;
    height: 50px;
    background: #e8d200;
    border: 3px solid #a09000;
    border-radius: 6px;
    font-size: 26px;
    font-weight: bold;
    color: #1a1a1a;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ctrl-btn:active {
    background: #c0aa00;
  }
</style>
</head>
<body>

<div id="wrapper">
  <canvas id="gameCanvas" width="270" height="480"></canvas>
  <div id="panel">
    <div class="panel-block">
      <div class="panel-label">Speed</div>
      <div id="panelSpeed">1</div>
    </div>
    <div class="panel-block">
      <div class="panel-label">Score</div>
      <div id="panelScore">0</div>
    </div>
  </div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="btnLeft">◄</button>
  <button class="ctrl-btn" id="btnRight">►</button>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const CANVAS_W = 270;
const CANVAS_H = 480;
const BLOCK    = 20;         // pixel size of each sprite block
const LANES    = 2;
const LANE_W   = CANVAS_W / LANES;  // 135 px per lane

// Car sprite: 3 columns × 4 rows
// Row 0 = 1 block  (nose)
// Row 1 = 3 blocks (front body)
// Row 2 = 1 block  (waist)
// Row 3 = 2 blocks separated (rear wheels)
const CAR_SPRITE = [
  [0,1,0],  //  0 – nose
  [1,1,1],  //  1 – front body
  [0,1,0],  //  2 – waist
  [1,0,1],  //  3 – rear wheels
];
const CAR_COLS   = CAR_SPRITE[0].length;  // 3
const CAR_ROWS   = CAR_SPRITE.length;     // 4
const CAR_W      = CAR_COLS * BLOCK;      // 60 px
const CAR_H      = CAR_ROWS * BLOCK;      // 80 px

// Lane X centres → left edge of car
function laneX(laneIndex) {
  return laneIndex * LANE_W + (LANE_W - CAR_W) / 2;
}

// ─── Audio ────────────────────────────────────────────────────────────────────
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playCrash() {
  ensureAudio();
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'square';
  const now = audioCtx.currentTime;
  osc.frequency.setValueAtTime(440, now);
  osc.frequency.exponentialRampToValueAtTime(60, now + 0.35);
  gain.gain.setValueAtTime(0.4, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
  osc.start(now);
  osc.stop(now + 0.35);
}

// ─── Game State ───────────────────────────────────────────────────────────────
const STATE = { START: 'start', PLAYING: 'playing', GAMEOVER: 'gameover' };
let gameState  = STATE.START;
let score      = 0;
let speedLevel = 1;
let scrollSpeed = 2;          // px per frame
let spawnTimer  = 0;
let spawnInterval = 90;       // frames between obstacle waves
let obstacles   = [];
let player      = {};
let rafId       = null;

function initPlayer() {
  player = {
    laneIndex: 0,
    x: laneX(0),
    y: CANVAS_H - CAR_H - 16,
  };
}

function resetGame() {
  score         = 0;
  speedLevel    = 1;
  scrollSpeed   = 2;
  spawnTimer    = 0;
  spawnInterval = 90;
  obstacles     = [];
  initPlayer();
  gameState = STATE.PLAYING;
  updatePanel();
}

// ─── Obstacle Spawning ────────────────────────────────────────────────────────
function spawnWave() {
  // With 2 lanes always block exactly 1, leaving the other free
  const blocked = Math.random() < 0.5 ? 0 : 1;
  obstacles.push({
    lane: blocked,
    x: laneX(blocked),
    y: -CAR_H,
  });
}

// ─── Collision (AABB) ─────────────────────────────────────────────────────────
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function checkCollision() {
  // Shrink hitbox slightly so grazing doesn't count
  const pad = 6;
  for (const ob of obstacles) {
    if (rectsOverlap(
      player.x + pad, player.y + pad, CAR_W - pad*2, CAR_H - pad*2,
      ob.x    + pad, ob.y    + pad, CAR_W - pad*2, CAR_H - pad*2,
    )) return true;
  }
  return false;
}

// ─── Drawing ──────────────────────────────────────────────────────────────────
function drawCar(ctx, x, y, fillColor, outlineColor) {
  for (let row = 0; row < CAR_ROWS; row++) {
    for (let col = 0; col < CAR_COLS; col++) {
      if (CAR_SPRITE[row][col]) {
        const bx = x + col * BLOCK;
        const by = y + row * BLOCK;
        ctx.fillStyle = fillColor;
        ctx.fillRect(bx, by, BLOCK - 1, BLOCK - 1);
        if (outlineColor) {
          ctx.strokeStyle = outlineColor;
          ctx.lineWidth = 1;
          ctx.strokeRect(bx + 0.5, by + 0.5, BLOCK - 2, BLOCK - 2);
        }
      }
    }
  }
}

function drawRoad(ctx) {
  // Solid road background
  ctx.fillStyle = '#5a6a50';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Lane divider (dashed centre line)
  ctx.setLineDash([18, 14]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#3a4a30';
  ctx.beginPath();
  ctx.moveTo(LANE_W, 0);
  ctx.lineTo(LANE_W, CANVAS_H);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawOverlay(ctx, lines, subLines) {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8d200';
  ctx.font = 'bold 22px monospace';
  let y = CANVAS_H / 2 - (lines.length * 28 + subLines.length * 20) / 2;
  for (const line of lines) {
    ctx.fillText(line, CANVAS_W / 2, y);
    y += 30;
  }
  ctx.fillStyle = '#cccccc';
  ctx.font = '15px monospace';
  for (const line of subLines) {
    ctx.fillText(line, CANVAS_W / 2, y);
    y += 22;
  }
}

// ─── Panel ────────────────────────────────────────────────────────────────────
function updatePanel() {
  document.getElementById('panelSpeed').textContent = speedLevel;
  document.getElementById('panelScore').textContent = score;
}

// ─── Main Loop ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

function gameLoop() {
  rafId = requestAnimationFrame(gameLoop);

  if (gameState === STATE.START) {
    drawRoad(ctx);
    drawCar(ctx, laneX(0), CANVAS_H / 2 - CAR_H, '#111', '#555');
    drawOverlay(ctx,
      ['BRICK RACER'],
      ['Press Enter or tap', 'a button to start'],
    );
    return;
  }

  if (gameState === STATE.GAMEOVER) {
    drawRoad(ctx);
    for (const ob of obstacles) drawCar(ctx, ob.x, ob.y, '#111', '#555');
    drawCar(ctx, player.x, player.y, '#111', '#e8d200');
    drawOverlay(ctx,
      ['GAME OVER'],
      [`Score: ${score}`, `Speed: ${speedLevel}`, '', 'Enter / tap to restart'],
    );
    return;
  }

  // ── PLAYING ──
  drawRoad(ctx);

  // Spawn
  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnWave();
  }

  // Move & draw obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].y += scrollSpeed;
    if (obstacles[i].y > CANVAS_H) {
      obstacles.splice(i, 1);
      score++;
      if (score % 10 === 0) {
        speedLevel++;
        scrollSpeed = Math.min(scrollSpeed + 1, 14);
        spawnInterval = Math.max(spawnInterval - 8, 28);
      }
      updatePanel();
      continue;
    }
    drawCar(ctx, obstacles[i].x, obstacles[i].y, '#111', '#555');
  }

  // Draw player (yellow outline to distinguish from obstacles)
  drawCar(ctx, player.x, player.y, '#111', '#e8d200');

  // Collision
  if (checkCollision()) {
    playCrash();
    gameState = STATE.GAMEOVER;
  }
}

// ─── Input — Keyboard ─────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (gameState === STATE.START) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      ensureAudio();
      resetGame();
    }
    return;
  }
  if (gameState === STATE.GAMEOVER) {
    if (e.key === 'Enter' || e.key === ' ') {
      ensureAudio();
      resetGame();
    }
    return;
  }
  if (e.key === 'ArrowLeft') {
    if (player.laneIndex > 0) {
      player.laneIndex--;
      player.x = laneX(player.laneIndex);
    }
    e.preventDefault();
  }
  if (e.key === 'ArrowRight') {
    if (player.laneIndex < LANES - 1) {
      player.laneIndex++;
      player.x = laneX(player.laneIndex);
    }
    e.preventDefault();
  }
});

// ─── Input — Touch Buttons ────────────────────────────────────────────────────
function moveLeft() {
  ensureAudio();
  if (gameState === STATE.START)    { resetGame(); return; }
  if (gameState === STATE.GAMEOVER) { resetGame(); return; }
  if (player.laneIndex > 0) {
    player.laneIndex--;
    player.x = laneX(player.laneIndex);
  }
}
function moveRight() {
  ensureAudio();
  if (gameState === STATE.START)    { resetGame(); return; }
  if (gameState === STATE.GAMEOVER) { resetGame(); return; }
  if (player.laneIndex < LANES - 1) {
    player.laneIndex++;
    player.x = laneX(player.laneIndex);
  }
}

const btnLeft  = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

btnLeft.addEventListener('mousedown',  e => { e.preventDefault(); moveLeft();  });
btnLeft.addEventListener('touchstart', e => { e.preventDefault(); moveLeft();  }, { passive: false });
btnRight.addEventListener('mousedown',  e => { e.preventDefault(); moveRight(); });
btnRight.addEventListener('touchstart', e => { e.preventDefault(); moveRight(); }, { passive: false });

// ─── Kick off ─────────────────────────────────────────────────────────────────
initPlayer();
gameLoop();
</script>
</body>
</html>
